<!doctype html><meta charset=utf-8><title>sky</title><style>html,body{margin:0;background:#050608}canvas{display:block;width:1120px;height:640px}</style><canvas id=c width=1120 height=640></canvas>
<script type=module>
import {altaz} from '/assets/js/starsky.js';
const stars=(await (await fetch('/data/stars.json')).json()).stars;
const q=new URLSearchParams(location.search), when=new Date(q.get('t')||'2026-10-25T04:00:00Z'), lat=+(q.get('lat')||34.05), lon=+(q.get('lon')||-118.24);
const VA=+(q.get('az')||180)*Math.PI/180, VE=+(q.get('el')||32)*Math.PI/180;   // view direction
const ctx=c.getContext('2d'), W=1120,H=640, R=Math.PI/180;
const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#04060a');bg.addColorStop(.7,'#070a10');bg.addColorStop(1,'#10100d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
/* colour from B-V (Ballesteros temperature, then a plain blackbody fit), then half-way back to white so the sky stays quiet */
function col(bv){const T=4600*(1/(.92*bv+1.7)+1/(.92*bv+.62)),t=T/100;let r,g,b;
 r=t<=66?255:329.7*Math.pow(t-60,-.1332);g=t<=66?99.47*Math.log(t)-161.1:288.1*Math.pow(t-60,-.0755);b=t>=66?255:t<=19?0:138.5*Math.log(t-10)-305;
 const m=(v)=>Math.round(Math.max(0,Math.min(255,v))*.55+255*.45);return `${m(r)},${m(g)},${m(b)}`}
/* stereographic view: direction (alt,az) to screen */
function proj(alt,az){const a=alt*R,z=az*R-VA;const x=Math.cos(a)*Math.sin(z),y=Math.sin(a)*Math.cos(VE)-Math.cos(a)*Math.cos(z)*Math.sin(VE),zz=Math.sin(a)*Math.sin(VE)+Math.cos(a)*Math.cos(z)*Math.cos(VE);
 if(zz<-.9)return null;const k=2/(1+zz)*330;return [W/2+x*k,H/2-y*k]}
let n=0;const out=[];
for(const s of stars){const p=altaz(s,when,lat,lon);if(p.alt<-1)continue;const xy=proj(p.alt,p.az);if(!xy||xy[0]<-20||xy[0]>W+20||xy[1]<-20||xy[1]>H+20)continue;
 const ext=p.alt<30?Math.pow(10,-.4*.25*(1/Math.max(Math.sin(Math.max(p.alt,1)*R),.05)-1)):1;      // thicker air near the ground dims stars
 const mag=s[2]+(-2.5*Math.log10(ext)), a=Math.max(.3,Math.min(1,Math.pow(10,-.11*(mag-1.0)))), r=Math.max(.7,3.2-.42*mag);
 ctx.fillStyle=`rgba(${col(s[3])},${a})`;ctx.beginPath();ctx.arc(xy[0],xy[1],r,0,7);ctx.fill();
 if(s[2]<1.6){ctx.fillStyle=`rgba(${col(s[3])},.10)`;ctx.beginPath();ctx.arc(xy[0],xy[1],r*4,0,7);ctx.fill()}n++}
/* the horizon: one fine line, nothing painted below it */
ctx.strokeStyle='rgba(120,110,90,.35)';ctx.lineWidth=1;ctx.beginPath();let f=true;for(let az=0;az<=360;az+=2){const xy=proj(0,az);if(!xy){f=true;continue}f?ctx.moveTo(xy[0],xy[1]):ctx.lineTo(xy[0],xy[1]);f=false}ctx.stroke();
window.N=n;window.done=1;
</script>
